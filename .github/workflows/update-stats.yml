name: Actualizar GitHub Stats

on:
  schedule:
    # Se ejecuta a medianoche (UTC) todos los domingos (cada 7 días)
    - cron: "0 0 * * 0"
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Descargar estadísticas de GitHub
        run: |
          # Descargamos las estadísticas a un archivo temporal para evitar sobrescribir con un archivo vacío si hay error.
          # Si curl tiene éxito, reemplazamos el archivo final. Si falla, el script no devuelve error y evita notificaciones.
          if curl -s -f "https://github-readme-stats.vercel.app/api?username=ruben-am&show_rank=true&hide_border=false&bg_color=0D1117&title_color=FFFFFF&text_color=828282&icon_color=828282&show_icons=true&count_private=true" -o temp-stats.svg; then
            mv temp-stats.svg assets/github-stats.svg
            echo "Estadísticas descargadas correctamente."
          else
            echo "Aviso: La API de GitHub Stats está caída. Se mantendrán las estadísticas anteriores y se omitirá la actualización."
          fi
          
      - name: Guardar y subir los cambios (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          # Solo hace commit si las estadísticas realmente han cambiado
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar estadísticas de GitHub" && git push)
