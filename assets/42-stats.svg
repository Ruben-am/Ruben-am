<svg
  width="170"
  height="195"
  viewBox="0 0 170 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">ralba-ma — 42 Madrid Stats</title>
  <desc id="descId">
    42 profile card showing Common Core, Intra level,
    current project and Madrid campus.
  </desc>

  <style>
    .header {
      font: 600 17px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #FFFFFF;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }

    @supports (-moz-appearance: auto) {
      .header {
        font-size: 15.5px;
      }
    }

    .stat {
      font: 600 13px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #828282;
    }

    @supports (-moz-appearance: auto) {
      .stat {
        font-size: 12px;
      }
    }

    .bold {
      font-weight: 700;
    }

    .subtitle {
      font: 600 9px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;
      letter-spacing: 0.45px;
      fill: #828282;
    }

    .location {
      font: 600 10px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;
      fill: #828282;
    }

    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }

    .logo-mark {
      transform-box: fill-box;
      transform-origin: center;
      animation: scaleInAnimation 0.3s ease-in-out 0.1s both;
    }
    
    .separator {
      stroke: #828282;
      stroke-width: 0.75;
      stroke-opacity: 0.4;
      stroke-linecap: round;
    }

    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes scaleInAnimation {
      from {
        opacity: 0;
        transform: scale(0.75);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .header,
      .stagger,
      .logo-mark {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    width="169"
    height="194"
    stroke="#e4e2e2"
    stroke-width="1"
    fill="#0D1117"
  />

  <g data-testid="card-title">

    <g
      class="stagger"
      style="animation-delay: 100ms"
      data-testid="42-logo"
    >
      <g
        transform="matrix(1.15 0 0 1.15 25 25.5)"
        fill="#FFFFFF"
      >
        <path
          class="logo-mark"
          d="m 24,12.42 -4.428,4.415 H 24 Z
             m -4.428,-4.417 -4.414,4.418 v 4.414 h 4.414 V 12.42 L 24,8.003 V 3.575 h -4.428 z
             m -4.414,0 4.414,-4.428 H 15.158 Z
             M 0,15.996 h 8.842 v 4.43 h 4.412 V 12.42 H 4.428 L 13.254,3.574 H 8.842 L 0,12.421 Z"
        />
      </g>
    </g>

    <g data-testid="identity-group">
      <text
        x="60"
        y="36.5"
        class="header"
        data-testid="header"
      >ralba-ma</text>

      <text
        x="60.5"
        y="49.5"
        class="subtitle stagger"
        style="animation-delay: 250ms"
        data-testid="curriculum"
      >COMMON CORE</text>
    </g>

  </g>

  <line
    class="separator stagger"
    style="animation-delay: 350ms"
    x1="25"
    y1="60"
    x2="145"
    y2="60"
    data-testid="separator-header"
  />

  <g data-testid="intra-level">

    <text
      x="25"
      y="77"
      class="stat bold stagger"
      style="animation-delay: 450ms"
      data-testid="intra-level-label"
    >INTRA LEVEL</text>

    <text
      x="25"
      y="95"
      class="stat bold stagger"
      style="animation-delay: 600ms"
      data-testid="intra-level-value"
    >Level 1 - 89%</text>

  </g>

  <line
    class="separator stagger"
    style="animation-delay: 700ms"
    x1="25"
    y1="105"
    x2="145"
    y2="105"
    data-testid="separator-intra"
  />

  <g data-testid="current-project">

    <text
      x="25"
      y="121"
      class="stat bold stagger"
      style="animation-delay: 750ms"
      data-testid="current-project-label"
    >CURRENT PROJECT</text>

    <text
      x="25"
      y="139"
      class="stat bold stagger"
      style="animation-delay: 900ms"
      data-testid="current-project-value"
    >push_swap</text>

  </g>

  <line
    class="separator stagger"
    style="animation-delay: 950ms"
    x1="25"
    y1="149"
    x2="145"
    y2="149"
    data-testid="separator-project"
  />

  <g
    class="stagger"
    style="animation-delay: 1050ms"
    data-testid="campus"
  >
    <circle
      cx="27"
      cy="163.5"
      r="2"
      fill="#828282"
    />

    <text
      x="34"
      y="167"
      class="location"
      data-testid="campus-label"
    >Madrid</text>
  </g>

</svg>
