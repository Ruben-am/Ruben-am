<svg xmlns="http://www.w3.org/2000/svg"
     width="300" height="195" viewBox="0 0 300 195"
     role="img" aria-labelledby="title desc">
  <title id="title">42 Madrid Stats — ruben-am</title>
  <desc id="desc">Square 42 Madrid profile card showing login, Intra level and current project.</desc>
  <defs>
    <style>
      .header { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #FFFFFF; }
      .eyebrow { font: 600 7.3px 'Segoe UI', Ubuntu, Sans-Serif; letter-spacing: .55px; fill: #828282; }
      .label { font: 600 9px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; letter-spacing: .5px; fill: #828282; }
      .value { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #FFFFFF; }
      .muted { font: 500 9px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #828282; }
    </style>
  </defs>

  <!-- Square card artwork: 195x195. Transparent space on the right preserves
       the existing README <img width="300"> layout without editing the README. -->
  <rect x="0.5" y="0.5" width="194" height="194" rx="4.5"
        stroke="#e4e2e2" stroke-width="1" fill="#0D1117" />

  <!-- Header -->
  <rect x="15" y="14" width="34" height="34" rx="6.5"
        fill="#0D1117" stroke="#828282" stroke-opacity="0.75" />
  <text x="32" y="35.5" text-anchor="middle"
        font-family="'Segoe UI', Ubuntu, Sans-Serif" font-size="15.5" font-weight="700"
        fill="#FFFFFF">42</text>
  <text class="header" x="58" y="29.5">ruben-am</text>
  <text class="eyebrow" x="58" y="42.5">42 MADRID | CADET</text>

  <line x1="15" y1="59" x2="180" y2="59"
        stroke="#828282" stroke-opacity="0.38" />

  <!-- Stacked stats keep the card square and avoid squeezing long project names. -->
  <text class="label" x="16" y="78">INTRA LEVEL</text>
  <text class="value" x="16" y="99">1 - 39%</text>

  <line x1="15" y1="111" x2="180" y2="111"
        stroke="#828282" stroke-opacity="0.38" />

  <text class="label" x="16" y="130">CURRENT PROJECT</text>
  <text class="value" x="16" y="151">get_next_line</text>

  <line x1="15" y1="164" x2="180" y2="164"
        stroke="#828282" stroke-opacity="0.38" />
  <circle cx="18" cy="179" r="2.5" fill="#828282" />
  <text class="muted" x="27" y="182">42 MADRID</text>
</svg>
