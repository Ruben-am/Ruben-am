<svg
  width="170"
  height="195"
  viewBox="0 0 170 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">ralba-ma — 42 Madrid Stats</title>
  <desc id="descId">
    42 profile card showing Common Core, Intra level progress,
    current project and Madrid campus.
  </desc>

  <style>
    /* Header typography */
    .header {
      font: 600 17px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #FFFFFF;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }

    @supports (-moz-appearance: auto) {
      .header {
        font-size: 15.5px;
      }
    }

    /* Same typography and muted color family as GitHub Stats */
    .stat {
      font: 600 13px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #828282;
    }

    @supports (-moz-appearance: auto) {
      .stat {
        font-size: 12px;
      }
    }

    .bold {
      font-weight: 700;
    }

    .subtitle {
      font: 600 9px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;
      letter-spacing: 0.45px;
      fill: #828282;
    }

    .location {
      font: 600 10px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;
      fill: #828282;
    }

    /* GitHub Stats staggered fade-in */
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }

    .logo-mark {
      transform-box: fill-box;
      transform-origin: center;
      animation: scaleInAnimation 0.3s ease-in-out 0.1s both;
    }

    /* Intra progress bar */
    .progress-track {
      stroke: #FFFFFF;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0.2;
    }

    .progress-bar {
      stroke: #FFFFFF;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0.8;
      stroke-dasharray: 46.8;
      stroke-dashoffset: 46.8;
      animation: progressAnimation 1s ease-in-out 0.65s forwards;
    }

    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes scaleInAnimation {
      from {
        opacity: 0;
        transform: scale(0.75);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes progressAnimation {
      from {
        stroke-dashoffset: 46.8;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .header,
      .stagger,
      .logo-mark,
      .progress-bar {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .progress-bar {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    width="169"
    height="194"
    stroke="#e4e2e2"
    stroke-width="1"
    fill="#0D1117"
  />

  <g data-testid="card-title">

    <g
      class="stagger"
      style="animation-delay: 100ms"
      data-testid="42-logo"
    >
      <rect
        x="25"
        y="25"
        width="30"
        height="30"
        rx="5.5"
        fill="#0D1117"
        stroke="#828282"
        stroke-width="1"
        stroke-opacity="0.75"
      />

      <g
        transform="matrix(0.875 0 0 0.875 28.9 28.9)"
        fill="#FFFFFF"
      >
        <path
          class="logo-mark"
          d="m 24,12.42 -4.428,4.415 H 24 Z
             m -4.428,-4.417 -4.414,4.418 v 4.414 h 4.414 V 12.42 L 24,8.003 V 3.575 h -4.428 z
             m -4.414,0 4.414,-4.428 H 15.158 Z
             M 0,15.996 h 8.842 v 4.43 h 4.412 V 12.42 H 4.428 L 13.254,3.574 H 8.842 L 0,12.421 Z"
        />
      </g>
    </g>

    <g data-testid="identity-group">
      <text
        x="65"
        y="39"
        class="header"
        data-testid="header"
      >ralba-ma</text>

      <text
        x="65"
        y="52"
        class="subtitle stagger"
        style="animation-delay: 250ms"
        data-testid="curriculum"
      >COMMON CORE</text>
    </g>

  </g>

  <g data-testid="intra-level">

    <text
      x="25"
      y="76"
      class="stat bold stagger"
      style="animation-delay: 450ms"
      data-testid="intra-level-label"
    >INTRA LEVEL</text>

    <text
      x="25"
      y="96"
      class="stat bold stagger"
      style="animation-delay: 600ms"
      data-testid="intra-level-value"
    >Level 1 - 39%</text>

    <line
      class="progress-track"
      x1="25"
      y1="106"
      x2="145"
      y2="106"
      data-testid="progress-track"
    />

    <line
      class="progress-bar"
      x1="25"
      y1="106"
      x2="71.8"
      y2="106"
      data-testid="progress-bar"
    />

  </g>

  <g data-testid="current-project">

    <text
      x="25"
      y="127.5"
      class="stat bold stagger"
      style="animation-delay: 750ms"
      data-testid="current-project-label"
    >CURRENT PROJECT</text>

    <text
      x="25"
      y="147.5"
      class="stat bold stagger"
      style="animation-delay: 900ms"
      data-testid="current-project-value"
    >get_next_line</text>

  </g>

  <g
    class="stagger"
    style="animation-delay: 1050ms"
    data-testid="campus"
  >
    <circle
      cx="27"
      cy="164"
      r="2"
      fill="#828282"
    />

    <text
      x="34"
      y="167.5"
      class="location"
      data-testid="campus-label"
    >Madrid</text>
  </g>

</svg>
